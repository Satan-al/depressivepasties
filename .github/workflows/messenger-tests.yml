name: Messenger checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules tests/auth.test.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/messenger.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messenger-screenshots
          path: screenshots/*.png
